<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Endless For Beacon FM Denpasar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
        <img src="Image/Endless For Beacon FM Denpasar.png" alt="Logo Radio Lokal" id="main-logo">
    </div>
        <h1>📻 Endless For Beacon FM Denpasar</h1>
        <p>The Smile Of The Stand Out For The Radio</p>
    </header>

    <main>
        <section id="radio-player">
            <h2>Dengarkan Siaran Langsung!</h2>
            
            <audio id="stream-player" controls autoplay>
                <source src="https://stream.zeno.fm/kzizu3f1dlatv.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>

            <button id="play-pause-btn">⏸️ Jeda</button>
            <p id="status-message">Streaming Siap...</p>
        </section>

        <section id="now-playing">
            <h3>Sedang Diputar:</h3>
            <p id="song-info">Mengambil informasi lagu...</p>
        </section>

        </main>

    <footer>
        <p>&copy; 2025 Endless For Beacon FM Denpasar.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
